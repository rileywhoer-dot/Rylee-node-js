name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  install-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Block QL/CodeQL artifacts
        run: |
          if find . -type f \( -name "*.ql" -o -name "*.qls" \) | grep -q .; then
            echo "QL files are not allowed in this repository."
            exit 1
          fi
          if grep -RInE "(^|[^a-zA-Z])codeql([^a-zA-Z]|$)|github/codeql-action" --exclude="ci.yml" .github package.json package-lock.json 2>/dev/null | grep -q .; then
            echo "CodeQL references are not allowed in workflow or package manifests."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.5

      - name: Pin npm version
        run: npm install --global npm@10.8.2

      - name: Install from lockfile
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
